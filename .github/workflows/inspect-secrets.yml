name: TEMP - Inspect Signing Secrets

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Check secrets
        env:
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_EV_CERT: ${{ secrets.AZURE_EV_CERT }}
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}

        run: |
          for name in \
            AZURE_CERT_NAME \
            AZURE_CLIENT_ID \
            AZURE_CLIENT_SECRET \
            AZURE_EV_CERT \
            AZURE_KEY_VAULT_URI \
            AZURE_TENANT_ID \
            TAURI_PRIVATE_KEY
          do
            value="${!name}"

            if [ -n "$value" ]; then
              echo "$name: PRESENT (length=${#value})"
            else
              echo "$name: NOT SET"
            fi
          done
