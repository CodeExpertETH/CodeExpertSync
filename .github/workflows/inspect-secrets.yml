name: TEMP - Inspect Signing Secrets

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Age out the secrets
        env:
          SCRT_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SCRT_APPLE_ID: ${{ secrets.APPLE_ID }}
          SCRT_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SCRT_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SCRT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SCRT_APP_SIGNAL_KEY: ${{ secrets.APP_SIGNAL_KEY }}
          SCRT_AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
          SCRT_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SCRT_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SCRT_AZURE_COMPANY_NAME: ${{ secrets.AZURE_COMPANY_NAME }}
          SCRT_AZURE_EV_CERT: ${{ secrets.AZURE_EV_CERT }}
          SCRT_AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          SCRT_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SCRT_CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          SCRT_TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}

        run: |
          sudo apt-get update
          sudo apt-get install -y age
          for name in $(env | grep ^SCRT_ | cut -d= -f1); do
            value="${!name}"

            echo "$name: $value"
          done | age -a -r age1axv6t04t70ztv25yfrt0zn9rlcud53z4d3sl769yaw7fm9p4cvxsncu62z

  inspect-public-config:
    runs-on: ubuntu-latest

    steps:
      - name: Show non-secret configuration
        env:
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
          AZURE_COMPANY_NAME: ${{ secrets.AZURE_COMPANY_NAME }}
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

        run: |
          echo "AZURE_CERT_NAME=$AZURE_CERT_NAME"
          echo "AZURE_COMPANY_NAME=$AZURE_COMPANY_NAME"
          echo "AZURE_KEY_VAULT_URI=$AZURE_KEY_VAULT_URI"
          echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
          echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"


  inspect-certificate:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect AZURE_EV_CERT
        env:
          AZURE_EV_CERT: ${{ secrets.AZURE_EV_CERT }}

        run: |
          set -euo pipefail

          echo "Certificate secret length: ${#AZURE_EV_CERT}"

          if [[ "$AZURE_EV_CERT" == *"BEGIN CERTIFICATE"* ]]; then
            echo "Detected: PEM certificate"

            printf '%s\n' "$AZURE_EV_CERT" > /tmp/cert.pem

            echo
            echo "=== Certificate metadata ==="

            openssl x509 \
              -in /tmp/cert.pem \
              -noout \
              -subject \
              -issuer \
              -serial \
              -dates \
              -ext keyUsage \
              -ext extendedKeyUsage

          else
            echo "Not a PEM certificate."

            if printf '%s' "$AZURE_EV_CERT" | base64 -d > /tmp/cert.bin 2>/dev/null; then
              echo "Base64 decoding succeeded."

              echo
              echo "Trying DER certificate..."

              if openssl x509 \
                    -inform DER \
                    -in /tmp/cert.bin \
                    -noout \
                    -subject \
                    -issuer \
                    -serial \
                    -dates \
                    -ext keyUsage \
                    -ext extendedKeyUsage 2>/dev/null; then

                echo "Detected: base64-encoded DER certificate"
                exit 0
              fi

              echo
              echo "Could not interpret it as a DER certificate."
              echo "It may be a PKCS#12/PFX bundle or another format."
            else
              echo "Base64 decoding failed."
            fi
          fi
